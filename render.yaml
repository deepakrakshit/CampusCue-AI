services:
  - type: web
    name: campuscue-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build --workspace=@campuscue/backend
    startCommand: node apps/backend/dist/index.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: GEMINI_EVAL_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_REVIEW_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
